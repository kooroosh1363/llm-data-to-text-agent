name: Data-to-Text Agent CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt --editable .
      - run: python -m pytest --quiet
      - name: Generate sample report
        run: >-
          d2t-agent
          --input data/sample/sales.csv
          --config data/sample/report_config.json
          --output outputs/sample-report.md
      - run: test -s outputs/sample-report.md

