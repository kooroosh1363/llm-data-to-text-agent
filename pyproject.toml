[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "d2t-agent"
version = "1.0.0"
description = "Evidence-first local data-to-text reporting agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
d2t-agent = "d2t_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

